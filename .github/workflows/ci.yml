name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [psql, h2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (${{ matrix.db }})
        run: ./mvnw verify -Ddb=${{ matrix.db }} -B -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcm4chee-arc-ui2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: dcm4chee-arc-ui2/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Angular app
        run: yarn build

      - name: Audit dependencies
        run: yarn audit --level high || true
